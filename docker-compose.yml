# Запуск из корня репозитория:  docker compose up -d --build
services:
  s1panel:
    build: .
    restart: unless-stopped
    ports:
      - "8686:8686"        # редактор/админка ("listen" в конфиге)
    volumes:
      - ./panel-data:/etc/s1panel   # конфиг + темы (засеваются при первом запуске)
    devices:
      # панель: передаём все её hidraw-узлы (свои: grep -l 4d9
      # /sys/class/hidraw/*/device/uevent). Экранный интерфейс зависит от
      # ревизии прошивки (iface 1 у старых, iface 2 у новых) — демон сам
      # выберет узел с 4104-байтным output-отчётом; узел вне контейнера
      # открыть не сможет, поэтому их лучше все здесь
      - /dev/hidraw0
      - /dev/hidraw1
      # LED-лента CH340
      - /dev/ttyUSB0
