# Запуск из корня репозитория:  docker compose up -d --build
services:
  s1panel:
    build: .
    restart: unless-stopped
    ports:
      - "8686:8686"        # редактор/админка ("listen" в конфиге)
    volumes:
      - ./panel-data:/etc/s1panel   # конфиг + темы (засеваются при первом запуске)
      # Сборка собрана с libusb-бэкендом (как оригинал): hidapi говорит с
      # панелью напрямую через usbfs, минуя ядровый hidraw — hidraw-узлы
      # (/dev/hidrawN) контейнеру не нужны, нужен доступ к USB-шине.
      # Дем сам выбирает экранный интерфейс панели (см. README).
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rwm'      # char-устройства USB (major 189)
    devices:
      # LED-лента CH340
      - /dev/ttyUSB0
