# Запуск из каталога golang/:  docker compose up -d --build
services:
  s1panel:
    build: .
    restart: unless-stopped
    ports:
      - "8686:8686"        # редактор/админка ("listen" в конфиге)
    volumes:
      - ./panel-data:/etc/s1panel   # конфиг + темы (засеваются при первом запуске)
    devices:
      # панель (найден номер: grep -l 04d9 /sys/class/hidraw/*/device/uevent)
      - /dev/hidraw0
      # LED-лента CH340
      - /dev/ttyUSB0
    # Если hidraw-номер «плавает», закрепите его udev-силинкой
    # (SUBSYSTEM=="hidraw", ATTRS{idVendor}=="04d9", ATTRS{idProduct}=="fd01",
    #  SYMLINK+="s1panel-hidraw") и укажите /dev/s1panel-hidraw здесь.
